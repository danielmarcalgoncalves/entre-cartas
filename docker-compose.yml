services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${RESERVED_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root_password}
      - DB_NAME=${DB_NAME:-filmes_db}
      - JWT_SECRET=${JWT_SECRET:-XSfvtJaid8X39mPyO3i8iHE6cCrGZZYHJ_FM7KsfXRqJhtqj9tnYkZMv2uFkuOWV_2026}
      - AUTH_SERVICE_URL=http://auth-service:3000
      - LOG_SERVICE_URL=http://log-service:3000
      # Google OAuth 2.0
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-}
      # MinIO — Object Storage para fotos de perfil
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=${MINIO_BUCKET:-perfil-fotos}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://minio:9000}
      # Stripe — Pagamentos e Assinatura Premium (Modo de Teste)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
    depends_on:
      - mariadb
      - auth-service
      - log-service
      - minio

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root_password}
      - DB_NAME=${DB_NAME:-filmes_db}
      - JWT_SECRET=${JWT_SECRET:-XSfvtJaid8X39mPyO3i8iHE6cCrGZZYHJ_FM7KsfXRqJhtqj9tnYkZMv2uFkuOWV_2026}
      - MAIL_HOST=${MAIL_HOST:-smtp-relay.brevo.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USER=${MAIL_USER:-}
      - MAIL_PASS=${MAIL_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-Between Letters}
      - REQUIRE_EMAIL_VERIFICATION=${REQUIRE_EMAIL_VERIFICATION:-false}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - LOG_SERVICE_URL=http://log-service:3000
    depends_on:
      - mariadb
      - log-service

  log-service:
    build:
      context: ./log-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # MinIO — Object Storage S3-compatível para arquivos de usuário (expostos apenas na rede interna da stack)
  minio:
    image: coollabsio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data

  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-filmes_db}
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
  redis_data:
  minio_data:

networks:
  default:
    driver: bridge
