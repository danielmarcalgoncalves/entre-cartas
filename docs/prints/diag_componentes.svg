<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6b4c2b"/>
    </marker>
    <marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="620" fill="#fcfaf5" rx="10" stroke="#d6cbb9" stroke-width="1.5"/>

  <!-- Title -->
  <text x="550" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c2219">
    Arquitetura de Componentes e Microsserviços — Entre Cartas (Between Letters SaaS)
  </text>
  <text x="550" y="54" text-anchor="middle" font-size="11.5" fill="#6e5d4b">
    Domínio público via Cloudflare / Reverse Proxy (:3000) vs. Rede Interna Isolada do Docker Compose (entre-cartas_default)
  </text>

  <!-- Left Zone: Public / Browser -->
  <rect x="25" y="75" width="215" height="270" rx="8" fill="#f4ede1" stroke="#b96f1f" stroke-width="1.5"/>
  <text x="132" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a4f0f">CAMADA PÚBLICA (INTERNET)</text>

  <rect x="42" y="115" width="180" height="90" rx="6" fill="#ffffff" stroke="#b96f1f" stroke-width="1.5"/>
  <text x="132" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c2219">Navegador do Usuário</text>
  <text x="132" y="158" text-anchor="middle" font-size="10.5" fill="#5c4d3c">Next.js 16 + React 19 SPA</text>
  <text x="132" y="174" text-anchor="middle" font-size="10" fill="#7a6855">My Desk · Journal · Letters</text>
  <text x="132" y="190" text-anchor="middle" font-size="10" fill="#7a6855">Clube Pro · Admin Exclusivo</text>

  <rect x="42" y="230" width="180" height="95" rx="6" fill="#fffdf9" stroke="#9e8c76" stroke-width="1.2"/>
  <text x="132" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c2219">Domínio &amp; Reverse Proxy</text>
  <text x="132" y="272" text-anchor="middle" font-size="10" fill="#5c4d3c">daniel-marcal-isw055</text>
  <text x="132" y="286" text-anchor="middle" font-size="10" fill="#5c4d3c">.lapps.studio (HTTPS :443)</text>
  <text x="132" y="306" text-anchor="middle" font-size="9.5" fill="#8a4f0f">Única porta exposta: :3000 → app</text>

  <!-- Bottom Left Zone: External SaaS -->
  <rect x="25" y="365" width="215" height="230" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="132" y="388" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3730a3">SAAS EXTERNOS (TERCEIROS)</text>

  <rect x="42" y="402" width="180" height="82" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="132" y="423" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#312e81">Stripe Billing &amp; Checkout</text>
  <text x="132" y="440" text-anchor="middle" font-size="10" fill="#4338ca">Checkout Session (Assinatura)</text>
  <text x="132" y="455" text-anchor="middle" font-size="10" fill="#4338ca">Customer Portal (/stripe/portal)</text>
  <text x="132" y="470" text-anchor="middle" font-size="10" fill="#4338ca">Webhooks HMAC (/stripe/webhook)</text>

  <rect x="42" y="498" width="180" height="80" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="132" y="520" text-anchor="middle" font-size="12" font-weight="bold" fill="#312e81">Brevo SMTP &amp; Google OAuth</text>
  <text x="132" y="538" text-anchor="middle" font-size="10" fill="#4338ca">E-mails transacionais OTP (6 dígitos)</text>
  <text x="132" y="554" text-anchor="middle" font-size="10" fill="#4338ca">Recuperação de senha &amp; Login Social</text>

  <!-- Center & Right Zone: Internal Docker Network -->
  <rect x="275" y="75" width="800" height="520" rx="10" fill="#f7f3eb" stroke="#6b4c2b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="675" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a3419">
    REDE INTERNA DO DOCKER COMPOSE (bridge: entre-cartas_default) — Sem portas expostas para a internet exceto app:3000
  </text>

  <!-- App Container (Gateway + BFF) -->
  <rect x="305" y="125" width="320" height="230" rx="8" fill="#ffffff" stroke="#b96f1f" stroke-width="2"/>
  <rect x="305" y="125" width="320" height="32" rx="8" fill="#b96f1f"/>
  <text x="465" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">
    Container: app (Node.js 20 + Express :3000)
  </text>
  <text x="465" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c2219">
    Frontend Estático (Next.js out/) + API Gateway / BFF
  </text>
  <text x="322" y="198" font-size="10.5" fill="#3d3024">• /api/journal — Cadernos (3 Free / 10 Pro) e Scrapbook Media</text>
  <text x="322" y="216" font-size="10.5" fill="#3d3024">• /api/cartas — Cartas (10 Free / 30 Pro) e Pastas (3 / 10)</text>
  <text x="322" y="234" font-size="10.5" fill="#3d3024">• /api/profile — Perfil e upload/stream de fotos no MinIO</text>
  <text x="322" y="252" font-size="10.5" fill="#3d3024">• /api/stripe — Checkout, Status, Portal e Webhook raw</text>
  <text x="322" y="270" font-size="10.5" fill="#3d3024">• /api/admin/* — Métricas, Usuários (paginado ≤20) e Logs</text>
  <text x="322" y="288" font-size="10.5" fill="#3d3024">• Middlewares: authMiddleware, requireAdmin, csrfProtection</text>
  <text x="322" y="306" font-size="10.5" fill="#3d3024">• /api/health — Healthcheck da aplicação</text>
  <rect x="322" y="318" width="286" height="24" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="465" y="334" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">
    PÚBLICO (porta 3000 mapeada no host/Portainer)
  </text>

  <!-- Auth Service Container -->
  <rect x="305" y="390" width="320" height="180" rx="8" fill="#ffffff" stroke="#3b7a57" stroke-width="1.8"/>
  <rect x="305" y="390" width="320" height="30" rx="8" fill="#3b7a57"/>
  <text x="465" y="410" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">
    Container: auth-service (Node.js 18 :3000 interno)
  </text>
  <text x="322" y="438" font-size="10.5" fill="#2c2219">• Registro, Login (bcrypt cost 10) e emissão de JWT</text>
  <text x="322" y="456" font-size="10.5" fill="#2c2219">• Verificação de e-mail com OTP de 6 dígitos e Reset Token</text>
  <text x="322" y="474" font-size="10.5" fill="#2c2219">• Google OAuth 2.0 e revogação de sessão (revoked_tokens)</text>
  <text x="322" y="492" font-size="10.5" fill="#2c2219">• RBAC real: usuario (Free), premium (Pro) e admin exclusivo</text>
  <text x="322" y="510" font-size="10.5" fill="#2c2219">• Validação exclusiva: danielpgmarcal@gmail.com → admin</text>
  <rect x="322" y="528" width="286" height="24" rx="4" fill="#dcfce7" stroke="#15803d"/>
  <text x="465" y="544" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">
    INTERNO (acessível apenas via http://auth-service:3000)
  </text>

  <!-- Right Column Inside Docker: MariaDB, Log-Service + Redis, MinIO -->
  <!-- MariaDB -->
  <rect x="720" y="125" width="330" height="135" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/>
  <rect x="720" y="125" width="330" height="28" rx="8" fill="#1d4ed8"/>
  <text x="885" y="144" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">
    Container: mariadb (MariaDB 10.11 :3306 interno)
  </text>
  <text x="735" y="170" font-size="10.5" fill="#1e293b">• Tabelas: usuarios, cadernos_usuario, pastas_usuario</text>
  <text x="735" y="187" font-size="10.5" fill="#1e293b">• cartas, cartas_salvas, notas_pessoais, carta_favoritos</text>
  <text x="735" y="204" font-size="10.5" fill="#1e293b">• stripe_subscriptions, stripe_webhook_events (idempotência)</text>
  <text x="735" y="221" font-size="10.5" fill="#1e293b">• Volume persistente: mariadb_data (/var/lib/mysql)</text>
  <text x="735" y="242" font-size="10" font-weight="bold" fill="#1d4ed8">INTERNO (expose: 3306 — sem porta pública)</text>

  <!-- Log Service + Redis -->
  <rect x="720" y="280" width="330" height="150" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8"/>
  <rect x="720" y="280" width="330" height="28" rx="8" fill="#b91c1c"/>
  <text x="885" y="299" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">
    Containers: log-service (:3000) + redis (Redis 7 :6379)
  </text>
  <text x="735" y="325" font-size="10.5" fill="#1e293b">• Ingestão não-bloqueante: POST http://log-service:3000/logs</text>
  <text x="735" y="342" font-size="10.5" fill="#1e293b">• Redis Streams (XADD / XREVRANGE) com AOF + 256MB LRU</text>
  <text x="735" y="359" font-size="10.5" fill="#1e293b">• Eventos: AUTH, JOURNAL, LETTER, FAVORITES, PAYMENT, ADMIN</text>
  <text x="735" y="376" font-size="10.5" fill="#1e293b">• Redação automática de senhas/tokens + Volume: redis_data</text>
  <text x="735" y="397" font-size="10" font-weight="bold" fill="#b91c1c">INTERNO (rede privada entre-cartas_default)</text>

  <!-- MinIO -->
  <rect x="720" y="450" width="330" height="120" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
  <rect x="720" y="450" width="330" height="28" rx="8" fill="#7c3aed"/>
  <text x="885" y="469" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">
    Container: minio (Object Storage S3 :9000/:9001 interno)
  </text>
  <text x="735" y="495" font-size="10.5" fill="#1e293b">• Bucket perfil-fotos: avatares dos autores (/api/profile/avatar)</text>
  <text x="735" y="512" font-size="10.5" fill="#1e293b">• Bucket privado journal-media: fotos de scrapbook nos cadernos</text>
  <text x="735" y="529" font-size="10.5" fill="#1e293b">• Volume persistente: minio_data (/data) — expose 9000/9001</text>
  <text x="735" y="550" font-size="10" font-weight="bold" fill="#7c3aed">INTERNO (acessado exclusivamente via SDK pelo app)</text>

  <!-- Arrows -->
  <!-- Browser -> Proxy -> App -->
  <line x1="132" y1="205" x2="132" y2="228" stroke="#6b4c2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="222" y1="275" x2="303" y2="240" stroke="#6b4c2b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="262" y="246" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#6b4c2b">HTTP :3000</text>

  <!-- App <-> Auth Service -->
  <line x1="465" y1="355" x2="465" y2="388" stroke="#3b7a57" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="376" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#166534">REST /auth/* + JWT</text>

  <!-- App -> MariaDB -->
  <line x1="625" y1="185" x2="718" y2="185" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="672" y="177" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1d4ed8">SQL Pool :3306</text>

  <!-- Auth -> MariaDB -->
  <line x1="625" y1="430" x2="718" y2="225" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- App -> Log Service -->
  <line x1="625" y1="295" x2="718" y2="335" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="672" y="305" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b91c1c">POST / GET /logs</text>

  <!-- Auth -> Log Service -->
  <line x1="625" y1="465" x2="718" y2="380" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- App -> MinIO -->
  <line x1="625" y1="335" x2="718" y2="495" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="665" y="438" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7c3aed">S3 SDK :9000</text>

  <!-- App <-> Stripe -->
  <line x1="305" y1="310" x2="224" y2="425" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow-ext)"/>
  <line x1="224" y1="455" x2="305" y2="335" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow-ext)"/>
  <text x="255" y="362" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4f46e5">Webhook / API</text>

  <!-- Auth -> Brevo -->
  <line x1="305" y1="520" x2="224" y2="535" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#arrow-ext)"/>
</svg>
